version: "3"

tasks:
  default:
    cmd: task --list

  remote:sync:
    dotenv:
      - .env.remote
    cmds:
      - rsync -avz ./config/otel-collector docker:$CONFIG_DIR
      - rsync -avz --exclude 'letsencrypt' ./config/traefik docker:$CONFIG_DIR
      - rsync -avz ./config/clickhouse docker:$CONFIG_DIR
      - rsync -avz ./config/signoz docker:$CONFIG_DIR
    desc: "Sync local infrastructure files to remote server"

  remote:deploy:
    dotenv:
      - .env.remote
    cmds:
      - docker --context remote compose --env-file .env.remote up -d --build --remove-orphans
    desc: Deploy infrastructure to remote

  remote:clean:
    dotenv:
      - .env.remote
    cmds:
      - docker --context remote compose --env-file .env.remote rm -v -f
    desc: Clean up remote docker compose stack

  remote:
    dotenv:
      - .env.remote
    cmds:
      - docker --context remote compose --env-file .env.remote {{.CLI_ARGS}}
    desc: Run docker compose with additional args
