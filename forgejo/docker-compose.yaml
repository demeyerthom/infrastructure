x-common: &common
  restart: unless-stopped
  logging:
    options:
      max-size: 50m
      max-file: "3"

name: forgejo
services:
  postgresql:
    <<: *common
    container_name: postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    image: postgres:16
    ports:
      - "5432:5432"
    volumes:
      - ${DATA_DIR:-./data}/postgresql:/var/lib/postgresql/data
      - ${CONFIG_DIR:-./config}/postgresql:/docker-entrypoint-initdb.d
    networks:
      - forgejo

  forgejo:
    <<: *common
    image: codeberg.org/forgejo/forgejo:15
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=postgresql:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=forgejo
    volumes:
      - ${DATA_DIR:-./data}/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
    networks:
      - forgejo

  docker-in-docker:
    <<: *common
    image: docker:dind
    container_name: docker_dind
    privileged: true
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    volumes:
      - ${DATA_DIR:-./data}/dind:/var/lib/docker
    networks:
      - forgejo

  runner:
    <<: *common
    image: data.forgejo.org/forgejo/runner:12
    container_name: forgejo-runner
    depends_on:
      docker-in-docker:
        condition: service_started
    environment:
      - DOCKER_HOST=tcp://docker-in-docker:2375
    user: "1001:1001"
    volumes:
      - ${DATA_DIR:-./data}/runner:/data
      - ${CONFIG_DIR:-./config}/runner/runner-config.yml:/data/runner-config.yml:ro
    command: forgejo-runner daemon --config /data/runner-config.yml
    networks:
      - forgejo

networks:
  forgejo:
    name: forgejo
    driver: bridge
