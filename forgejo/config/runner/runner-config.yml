# Forgejo Runner configuration
#
# This file is based on the default config generated by:
#   forgejo-runner generate-config
#
# Customize before first deploy:
#   1. Register the runner in Forgejo UI at:
#      https://git.de-meyer.nl/admin/actions/runners
#   2. Copy the UUID and Token from the UI
#   3. Replace REPLACE_WITH_UUID and REPLACE_WITH_TOKEN below
#   4. Restart the runner container:
#      docker --context forgejo compose --env-file forgejo/.env.remote \
#        -f forgejo/docker-compose.yaml restart runner

log:
  # level: info|debug|trace|warn|error|fatal
  level: info
  # job_level: what is sent to Forgejo and visible in the web UI
  job_level: info

runner:
  # Where to store the registration result.
  file: .runner
  # Execute how many tasks concurrently at the same time.
  # Increase to allow parallel jobs (ensure host has enough resources).
  capacity: 1
  # Extra environment variables to run jobs.
  # DOCKER_HOST is passed into job containers so workflows can run
  # `docker build` etc. against the DinD sidecar.
  envs:
    DOCKER_HOST: tcp://docker-in-docker:2375
  # Extra environment variables to run jobs from a file.
  # Ignored if empty or the file doesn't exist.
  env_file: .env
  # The timeout for a job to be finished.
  # Note: the Forgejo instance also has a timeout (3h by default).
  timeout: 3h
  # Whether skip verifying the TLS certificate of the Forgejo instance.
  insecure: false
  # The timeout for fetching the job from the Forgejo instance.
  fetch_timeout: 5s
  # The interval for fetching the job from the Forgejo instance.
  fetch_interval: 2s
  # The labels of a runner determine which jobs it can run and how.
  # Format: <name>:<type>://<image>
  #   - docker type runs jobs in a Docker container from the given image
  #   - host type runs jobs directly on the host (no isolation)
  #   - lxc type runs jobs in an LXC container
  labels:
    - ubuntu-latest:docker://node:lts
    - docker:docker://ghcr.io/catthehacker/ubuntu:act-22.04

cache:
  # Enable cache server to use actions/cache.
  enabled: true
  # The directory to store the cache data.
  # If empty, the cache data will be stored in $HOME/.cache/actcache.
  dir: ""
  # The host of the cache server (address to connect from job containers).
  # Leave empty to detect automatically.
  host: ""
  # The port of the cache server. 0 means use a random available port.
  port: 8088

container:
  # Specifies the network to which the container will connect.
  # If empty, create a network automatically for each job (recommended).
  network: ""
  # Whether to create networks with IPv6 enabled.
  # Only takes effect if "network" is empty.
  enable_ipv6: false
  # Whether to use privileged mode when launching task containers.
  # privileged is required for Docker-in-Docker within jobs.
  privileged: false
  # Other options to be used when the container is started.
  options: ""
  # Volumes (including bind mounts) that can be mounted to containers.
  # Empty means no volumes can be mounted (most secure).
  valid_volumes: []
  # Overrides the docker client host with the specified one.
  # Points to the DinD sidecar so job containers are created there,
  # keeping them isolated from the host Docker daemon.
  docker_host: tcp://docker-in-docker:2375
  # Pull docker image(s) even if already present.
  force_pull: false

host:
  # The parent directory of a job's working directory.
  # If empty, $HOME/.cache/act/ will be used.
  workdir_parent:

server:
  connections:
    forgejo:
      # The Forgejo instance URL.
      # Uses the internal Docker network service name since the runner
      # is in the same compose stack as Forgejo.
      url: https://git.de-meyer.nl/
      # UUID and Token from the Forgejo UI after registering the runner:
      #   https://git.de-meyer.nl/admin/actions/runners
      uuid: 0a0f4ed5-32c0-444e-81ea-4691212ad6ad
      token: 23645fcc52d6f52f54a0b7fd0e169376aa8e4bdf
